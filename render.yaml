services:
- type: web
  name: privashield-backend
  buildCommand: npm install
  startCommand: npm start
  rootDir: backend
  envVars:
  - key: PORT
    value: '5000'
  runtime: node
  plan: free
- type: web
  name: privashield-frontend
  buildCommand: npm install && npm run build
  rootDir: frontend
  headers:
  - path: /*
    name: Access-Control-Allow-Origin
    value: '*'
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  runtime: static
  staticPublishPath: dist
databases:
- name: privashield-db
  databaseName: privashield
  user: admin
  plan: free
