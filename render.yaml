services:
- type: web
  name: privashield-backend
  buildCommand: npm install
  startCommand: npm start
  rootDir: backend
  envVars:
  - key: PORT
    value: '5000'
  - key: RAG_API_URL
    sync: false
  runtime: node
  plan: free
- type: web
  name: privashield-frontend
  buildCommand: npm install && npm run build
  rootDir: frontend
  headers:
  - path: /*
    name: Access-Control-Allow-Origin
    value: '*'
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  envVars:
  - key: VITE_BACKEND_URL
    value: https://privashield-backend.onrender.com
  runtime: static
  staticPublishPath: dist

