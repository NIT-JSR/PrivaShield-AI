    <style>
        body {
            background-color: #02040F; /* Deepest black/blue base */
            background-image: radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, rgba(76, 215, 246, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-clip: padding-box;
            position: relative;
        }

        .glass-panel-hover:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(208, 188, 255, 0.3);
            box-shadow: 0 0 20px rgba(208, 188, 255, 0.1);
            transform: translateY(-2px);
        }

        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(90deg, #d0bcff, #4cd7f6);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6d3bd7, #4c1d95);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            box-shadow: 0 4px 15px rgba(109, 59, 215, 0.4);
            transform: scale(1.02);
        }
